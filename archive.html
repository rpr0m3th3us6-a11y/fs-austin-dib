<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIB Archive — Four Seasons Austin</title>
  <style>
    :root { --navy:#0D1B2A; --teal:#01696F; --border:#CBD5DC; --bg:#F4F6F8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; background:var(--bg); color:#1A1A2E; font-size:14px; }
    .header { background:var(--navy); color:white; padding:16px 20px; }
    .header h1 { font-size:18px; }
    .header p { font-size:11px; color:#6A9FA5; margin-top:4px; }
    .container { max-width:900px; margin:0 auto; padding:20px; }
    .back-link { display:inline-block; margin-bottom:16px; color:var(--teal); text-decoration:none; font-size:12px; }
    .archive-table { width:100%; border-collapse:collapse; background:white; }
    .archive-table th { background:var(--navy); color:white; padding:8px 12px; text-align:left; font-size:11px; letter-spacing:0.5px; }
    .archive-table td { padding:8px 12px; border-bottom:1px solid var(--border); font-size:12px; }
    .archive-table tr:hover td { background:#F0F4F7; }
    .archive-table td a { color:var(--teal); text-decoration:none; font-weight:600; }
    .footer { background:var(--navy); color:#6A9FA5; text-align:center; font-size:10px; letter-spacing:1px; padding:10px; margin-top:20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>DIB Archive &mdash; Four Seasons Hotel Austin</h1>
    <p>Security Office // 41 | UNCLASSIFIED // FOR INTERNAL SECURITY USE ONLY</p>
  </div>
  <div class="container">
    <a class="back-link" href="index.html">&#x2190; Back to Today&rsquo;s Brief</a>
    <table class="archive-table">
      <thead><tr><th>Date</th><th>Day</th><th>Full Report</th><th>1-Pager</th></tr></thead>
      <tbody id="archive-body"><tr><td colspan="4" style="text-align:center;padding:16px;color:#999">Loading archive...</td></tr></tbody>
    </table>
  </div>
  <div class="footer">UNCLASSIFIED // FOR INTERNAL SECURITY USE | Four Seasons Hotel Austin | 98 San Jacinto Blvd, Austin TX 78701</div>
  <script>
    fetch('archive.json')
      .then(r => r.json())
      .then(entries => {
        const tbody = document.getElementById('archive-body');
        if (!entries.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:#999">No archived briefs yet.</td></tr>'; return; }
        tbody.innerHTML = entries.slice().reverse().map(e =>
          `<tr>
            <td>${e.date_str}</td>
            <td>${e.day_str}</td>
            <td>${e.full_pdf_url ? `<a href="${e.full_pdf_url}" target="_blank">&#x2B07; Full Report</a>` : '—'}</td>
            <td>${e.onepager_pdf_url ? `<a href="${e.onepager_pdf_url}" target="_blank">&#x2B07; 1-Pager</a>` : '—'}</td>
          </tr>`).join('');
      })
      .catch(() => { document.getElementById('archive-body').innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:#999">Archive unavailable.</td></tr>'; });
  </script>
</body>
</html>
